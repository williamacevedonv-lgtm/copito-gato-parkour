<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Copito en las alturas</title>
<style>
:root{--ink:#25324a;--cream:#fff8e9;--pink:#ff7c9d;--blue:#68d5d0;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:#c5f0e9;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;display:grid;min-height:100svh;place-items:center;padding:14px}.wrap{width:min(100%,1000px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px}.brand h1{font-size:clamp(1.2rem,3vw,2rem);margin:0;letter-spacing:-.04em}.brand p{margin:2px 0 0;font-size:.88rem;opacity:.75}.hud{display:flex;gap:8px;align-items:center}.pill,button{border:0;border-radius:999px;background:var(--cream);color:var(--ink);font:inherit;font-weight:800;padding:10px 15px;box-shadow:0 4px 0 #25324a20}.pill{white-space:nowrap}button{cursor:pointer;transition:transform .12s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(2px);box-shadow:none}.stage{position:relative;background:#8de0d3;border:5px solid var(--cream);border-radius:24px;overflow:hidden;box-shadow:0 10px 0 #377c7a25;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:960/540}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#24314b77;padding:20px}.card{max-width:430px;text-align:center;background:var(--cream);border-radius:24px;padding:25px 28px;box-shadow:0 8px 0 #25324a30}.card h2{margin:0 0 8px;font-size:clamp(1.6rem,5vw,2.35rem);letter-spacing:-.04em}.card p{line-height:1.55;margin:7px 0 18px}.card button{background:var(--pink);padding:12px 22px;font-size:1rem}.hidden{display:none}.mobile{display:none;justify-content:space-between;align-items:center;padding:11px 4px 0;gap:12px}.dpad{display:flex;gap:9px}.mobile button{width:58px;height:52px;padding:0;font-size:1.2rem;background:var(--cream);touch-action:none}.mobile .jump{width:92px;background:var(--pink)}.hint{text-align:center;font-size:.85rem;margin:10px 0 0;opacity:.75}@media(max-width:650px){body{padding:9px}.mobile{display:flex}header{align-items:flex-start}.brand p{max-width:180px}.hud{gap:5px}.pill,header button{padding:9px 11px;font-size:.85rem}.hint{font-size:.77rem}}
</style></head>
<body><main class="wrap"><header><div class="brand"><h1>🐾 Copito en las alturas</h1><p>Corre, salta y llega hasta la caja de regalo.</p></div><div class="hud"><span class="pill">🦴 <span id="bones">0</span></span><span class="pill">🐾 <span id="lives">3</span></span><button id="restart" aria-label="Reiniciar">↻</button></div></header><div class="stage"><canvas id="game" width="960" height="540" aria-label="Juego de plataformas de un gato"></canvas><div id="overlay" class="overlay"><section class="card"><h2 id="title">¡A por la aventura!</h2><p id="copy">Guía a Copito por las plataformas, recoge los pescaditos y esquiva los charcos. Llega a la caja de regalo para ganar.</p><button id="start">¡Jugar!</button></section></div></div><div class="mobile"><div class="dpad"><button id="left" aria-label="Mover a la izquierda">←</button><button id="right" aria-label="Mover a la derecha">→</button></div><button class="jump" id="jump">SALTAR ⤴</button></div><p class="hint">Teclado: ← → o A D para correr · Espacio / ↑ para saltar · R para reiniciar</p></main>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),W=960,H=540;const ui={bones:document.querySelector('#bones'),lives:document.querySelector('#lives'),overlay:document.querySelector('#overlay'),title:document.querySelector('#title'),copy:document.querySelector('#copy'),start:document.querySelector('#start')};
const platforms=[{x:0,y:475,w:240},{x:290,y:420,w:150},{x:500,y:360,w:145},{x:700,y:300,w:130},{x:850,y:390,w:110},{x:1010,y:330,w:160},{x:1235,y:270,w:140},{x:1440,y:355,w:160},{x:1660,y:300,w:150},{x:1870,y:390,w:250},{x:2140,y:320,w:170},{x:2370,y:260,w:170},{x:2600,y:355,w:240},{x:2900,y:300,w:150},{x:3110,y:240,w:230},{x:3400,y:325,w:160},{x:3620,y:265,w:150},{x:3830,y:350,w:170},{x:4050,y:290,w:250}];const fish=[{x:335,y:377},{x:550,y:317},{x:747,y:257},{x:1040,y:287},{x:1280,y:227},{x:1490,y:312},{x:1720,y:257},{x:1960,y:352},{x:2200,y:277},{x:2440,y:217},{x:2680,y:312},{x:3150,y:197},{x:3450,y:292},{x:3670,y:232},{x:3880,y:317},{x:4110,y:257}];const puddles=[{x:130,y:445,w:48},{x:1110,y:300,w:42},{x:2020,y:330,w:44},{x:2780,y:325,w:45},{x:3510,y:305,w:42},{x:3960,y:330,w:42}];let keys={},held={left:false,right:false},player,cam=0,bones=0,lives=3,state='intro',last=0,particles=[];
function reset(){player={x:45,y:420,vx:0,vy:0,w:38,h:44,ground:false,inv:0,face:1};cam=0;bones=0;lives=3;fish.forEach(f=>f.got=false);particles=[];sync()};function sync(){ui.bones.textContent=bones;ui.lives.textContent=lives}function start(){reset();state='play';ui.overlay.classList.add('hidden')};function end(win){state=win?'win':'lose';ui.title.textContent=win?'¡Meta alcanzada! 🎉':'¡Ups, Copito cayó!';ui.copy.textContent=win?`¡Lo lograste! Recogiste ${bones} pescaditos y llegaste a la caja.`:`Te quedaste sin vidas. Recogiste ${bones} pescaditos. ¡Inténtalo otra vez!`;ui.start.textContent='Jugar otra vez';ui.overlay.classList.remove('hidden')};function respawn(){lives--;sync();if(lives<=0){end(false);return}player.x=Math.max(30,Math.min(player.x,3800));player.y=-70;player.vy=0;player.inv=100}
function rect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawBg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8edfd5');g.addColorStop(1,'#d8f5c5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff7d8';[[130,80,35],[430,110,24],[790,67,30]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()});ctx.fillStyle='#ffffff66';for(let i=0;i<5;i++){let x=((i*235-cam*.2)%(W+150)+W+150)%(W+150)-50,y=75+(i%3)*42;ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.arc(x+25,y-9,25,0,7);ctx.arc(x+53,y,18,0,7);ctx.fill()}ctx.fillStyle='#77cbb6';for(let i=0;i<6;i++){let x=((i*205-cam*.35)%(W+230)+W+230)%(W+230)-110;ctx.beginPath();ctx.ellipse(x,460,140,110,0,Math.PI,0);ctx.fill()}}
function drawPlatform(p){let x=p.x-cam;if(x+p.w<0||x>W)return;rect(x,p.y,p.w,H-p.y+10,10,'#6a58a8');rect(x,p.y,p.w,17,8,'#9a75cf');rect(x+5,p.y+17,p.w-10,7,4,'#554a91')}
function drawFish(f){if(f.got)return;let x=f.x-cam,y=f.y+Math.sin(performance.now()/240+f.x)*5;ctx.save();ctx.translate(x,y);ctx.fillStyle='#ff9c56';ctx.beginPath();ctx.ellipse(0,0,13,8,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-20,-8);ctx.lineTo(-19,8);ctx.closePath();ctx.fill();ctx.fillStyle='#26344c';ctx.beginPath();ctx.arc(6,-2,1.8,0,7);ctx.fill();ctx.restore()}
function drawPuddle(p){let x=p.x-cam;ctx.fillStyle='#526fae';ctx.beginPath();ctx.ellipse(x+p.w/2,p.y+8,p.w/2,10,0,0,7);ctx.fill();ctx.fillStyle='#94e1e1';ctx.beginPath();ctx.ellipse(x+p.w/2-6,p.y+5,p.w/5,3,0,0,7);ctx.fill()}
function drawCat(){let x=player.x-cam,y=player.y;if(player.inv>0&&Math.floor(player.inv/6)%2===0)return;ctx.save();ctx.translate(x+player.w/2,y+player.h/2);if(player.face<0)ctx.scale(-1,1);const run=Math.abs(player.vx)>1?Math.sin(performance.now()/55)*4:0;ctx.fillStyle='#25334a';// tail
ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-12,10);ctx.quadraticCurveTo(-27,0,-21,-13);ctx.strokeStyle='#ef874f';ctx.stroke();ctx.fillStyle='#ef874f';ctx.beginPath();ctx.ellipse(0,3,17,19,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-11,17,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-15,-19);ctx.lineTo(-15,-35);ctx.lineTo(-4,-25);ctx.moveTo(5,-25);ctx.lineTo(16,-36);ctx.lineTo(15,-17);ctx.fill();ctx.fillStyle='#ffcf8c';ctx.beginPath();ctx.moveTo(-12,-20);ctx.lineTo(-13,-30);ctx.lineTo(-7,-24);ctx.moveTo(9,-24);ctx.lineTo(14,-31);ctx.lineTo(13,-19);ctx.fill();ctx.fillStyle='#fff8e9';ctx.beginPath();ctx.ellipse(-7,-10,5,6,0,0,7);ctx.ellipse(7,-10,5,6,0,0,7);ctx.fill();ctx.fillStyle='#24324a';ctx.beginPath();ctx.ellipse(-6,-10,2,4,0,0,7);ctx.ellipse(8,-10,2,4,0,0,7);ctx.fill();ctx.fillStyle='#ff7c9d';ctx.beginPath();ctx.moveTo(-2,-3);ctx.lineTo(3,-3);ctx.lineTo(.5,0);ctx.fill();ctx.strokeStyle='#704440';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(.5,0);ctx.lineTo(.5,3);ctx.quadraticCurveTo(-3,6,-6,2);ctx.moveTo(.5,3);ctx.quadraticCurveTo(4,6,7,2);ctx.stroke();ctx.strokeStyle='#fff3d8';ctx.lineWidth=1;for(let i=0;i<3;i++){let yy=-1+i*4;ctx.beginPath();ctx.moveTo(-7,yy);ctx.lineTo(-22,yy-3);ctx.moveTo(7,yy);ctx.lineTo(22,yy-3);ctx.stroke()}rect(-12,16+run,9,8,4,'#f5b45f');rect(4,16-run,9,8,4,'#f5b45f');ctx.restore()}
function drawGoal(){let x=4100-cam;rect(x,190,112,104,20,'#fff1d1');rect(x+9,202,94,84,14,'#ff7c9d');ctx.fillStyle='#ffd166';ctx.beginPath();ctx.moveTo(x+56,190);ctx.bezierCurveTo(x+12,158,x+26,140,x+53,174);ctx.bezierCurveTo(x+62,140,x+101,153,x+58,190);ctx.fill();ctx.fillStyle='#25334a';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('¡META!',x+56,250)}
function update(dt){if(state!=='play')return;let p=player;p.inv=Math.max(0,p.inv-dt);let dir=(held.right||keys.ArrowRight||keys.KeyD?1:0)-(held.left||keys.ArrowLeft||keys.KeyA?1:0);p.vx=dir*4.2;if(dir)p.face=dir;p.x=Math.max(0,Math.min(4300,p.x+p.vx*dt));if((keys.Space||keys.ArrowUp||keys.KeyW||keys.jump)&&p.ground){p.vy=-12.4;p.ground=false;keys.jump=false}let prev=p.y;p.vy+=.58*dt;p.y+=p.vy*dt;p.ground=false;for(const q of platforms){if(p.x+p.w>q.x+2&&p.x<q.x+q.w-2&&prev+p.h<=q.y+5&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true}}if(p.y>H+80){respawn();return}for(const f of fish)if(!f.got&&Math.abs((p.x+p.w/2)-f.x)<24&&Math.abs((p.y+p.h/2)-f.y)<25){f.got=true;bones++;sync()}for(const z of puddles)if(p.x+p.w>z.x&&p.x<z.x+z.w&&p.y+p.h>z.y&&p.y+p.h<z.y+30&&p.inv===0)respawn();cam=Math.max(0,Math.min(3340,p.x-260));if(p.x>4110)end(true)}
function render(){drawBg();platforms.forEach(drawPlatform);puddles.forEach(drawPuddle);fish.forEach(drawFish);drawGoal();drawCat();ctx.fillStyle='#25334a';ctx.font='700 13px system-ui';ctx.textAlign='left';ctx.fillText('CORRE, COPITO, CORRE',22,29);}
function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;update(dt);render();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR')start()});window.addEventListener('keyup',e=>keys[e.code]=false);function bind(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(key==='jump')keys.jump=true;else held[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(key!=='jump')held[key]=false}))}bind('left','left');bind('right','right');bind('jump','jump');document.querySelector('#start').onclick=start;document.querySelector('#restart').onclick=start;reset();requestAnimationFrame(loop)})();
</script></body></html>
